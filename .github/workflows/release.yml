name: Release

# Push a tag that matches the version in Cargo.toml to cut a release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Every target is built first. The GitHub release is created only once all of them succeed, so
# `releases/latest/download/...` (which the install scripts use) never points at a partial release.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: check tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag and crate version
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux builds link musl statically, so one binary runs on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    env:
      # aws-lc-sys (rustls' crypto backend) needs NASM on x86_64 Windows unless it may use its prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install # no args: installs what rust-toolchain.toml pins
          rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="fieldtrip-${{ matrix.target }}"
          staging="dist/$name"
          mkdir -p "$staging"
          cp README.md LICENSE "$staging/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/fieldtrip.exe" "$staging/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/fieldtrip" "$staging/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "$staging"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: fieldtrip-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: fieldtrip-*
          path: dist
          merge-multiple: true

      - name: Add install scripts and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS dist/
          cat dist/SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
